name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      SSH_OPTS: >-
        -o BatchMode=yes
        -o StrictHostKeyChecking=accept-new
        -o ConnectTimeout=20
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=4
      SSH_HOST: ${{ secrets.SSH_HOST || 'eureka.reliableuksolutions.com' }}
      SSH_USER: ${{ secrets.SSH_USER || 'u562520413' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/u562520413/domains/eureka.reliableuksolutions.com/public_html' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in SSH_HOST SSH_USER SSH_PORT DEPLOY_PATH SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          echo "Deploy path resolved to: ${DEPLOY_PATH}"

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep $((i * 3))
          done
          true

      - name: Update code on server
        shell: bash
        run: |
          repo_url="git@github.com:rajin10/eureka.git"
          remote_cmd="cd '$DEPLOY_PATH' && \
            (git remote set-url origin '$repo_url' 2>/dev/null || git remote add origin '$repo_url') && \
            timeout 150 git -c core.sshCommand='ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15' fetch origin && \
            git reset --hard origin/main"

          n=0
          until ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                  "$SSH_USER@$SSH_HOST" "$remote_cmd"; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Failed to update code on server after $n attempts."
              exit 1
            fi
            echo "Attempt $n failed, retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      - name: Upload built assets
        shell: bash
        run: |
          n=0
          until rsync -az --delete \
                  -e "ssh $SSH_OPTS -i ~/.ssh/deploy_key -p $SSH_PORT" \
                  public/build/ \
                  "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/public/build/"; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Failed to upload built assets after $n attempts."
              exit 1
            fi
            echo "Attempt $n failed, retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      - name: Run post-deploy script
        shell: bash
        run: |
          n=0
          until ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                  "$SSH_USER@$SSH_HOST" \
                  "cd '$DEPLOY_PATH' && bash scripts/deploy.sh"; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Post-deploy script failed after $n attempts."
              exit 1
            fi
            echo "Attempt $n failed, retrying in $((n * 10))s..."
            sleep $((n * 10))
          done
