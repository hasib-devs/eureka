name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      # Non-interactive SSH: never prompt for a host key or password (which would
      # hang the job); auto-trust new host keys; fail fast on unreachable hosts.
      SSH_OPTS: >-
        -o BatchMode=yes
        -o StrictHostKeyChecking=accept-new
        -o ConnectTimeout=20
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Best-effort: pre-populate known_hosts. StrictHostKeyChecking=accept-new
          # covers us if this transiently fails, so never fail the build here.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep $((i * 3))
          done
          true

      - name: Update code on server
        run: |
          # Inner git fetch uses non-interactive SSH + a hard timeout so a broken
          # server->GitHub connection fails fast instead of hanging for minutes.
          remote_cmd="cd ${{ secrets.DEPLOY_PATH }} && \
            timeout 150 git -c core.sshCommand='ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15' fetch origin && \
            git reset --hard origin/main"
          n=0
          until ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
                  "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "$remote_cmd"; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Failed to update code on server after $n attempts."
              exit 1
            fi
            echo "Attempt $n failed, retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      - name: Upload built assets
        run: |
          n=0
          until rsync -az --delete \
                  -e "ssh $SSH_OPTS -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
                  public/build/ \
                  "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/build/"; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Failed to upload built assets after $n attempts."
              exit 1
            fi
            echo "Attempt $n failed, retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      - name: Run post-deploy script
        run: |
          n=0
          until ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
                  "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                  "cd ${{ secrets.DEPLOY_PATH }} && bash scripts/deploy.sh"; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Post-deploy script failed after $n attempts."
              exit 1
            fi
            echo "Attempt $n failed, retrying in $((n * 10))s..."
            sleep $((n * 10))
          done
